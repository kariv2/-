<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <!-- Google Fonts for Vintage Khmer Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,600;0,700;1,400&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #07090e;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. RAIN CANVAS & WET STREET BOKEH */
    #rain-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at 50% 60%, #101522 0%, #05070a 100%);
    }

    /* 2. 35MM VINTAGE FILM GRAIN & VIGNETTE */
    #film-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(20, 15, 10, 0.15) 0%, rgba(0, 0, 0, 0.78) 100%);
      pointer-events: none;
      z-index: 10;
    }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.18;
      pointer-events: none;
      z-index: 11;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 6px 6px;
      animation: filmFlicker 0.15s infinite;
    }

    @keyframes filmFlicker {
      0% { transform: translate(0, 0); opacity: 0.16; }
      50% { transform: translate(1px, -1px); opacity: 0.22; }
      100% { transform: translate(-1px, 1px); opacity: 0.18; }
    }

    /* 3. CINEMATIC LETTERBOX BARS */
    .letterbox-bar {
      position: fixed;
      left: 0; width: 100vw;
      height: 6vh;
      background: #000000;
      z-index: 100;
      pointer-events: none;
    }
    .letterbox-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .letterbox-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    /* ==========================================================
       4. CENTER GLOWING GOLDEN KHMER TYPOGRAPHY
       ========================================================== */
    #lyric-stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 20px;
    }

    .vintage-lyric {
      position: absolute;
      text-align: center;
      width: min(90vw, 750px);
      font-family: 'Koulen', 'Kantumruy Pro', cursive, sans-serif;
      font-size: clamp(26px, 4.2vw, 48px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.03em;
      
      /* Amber Gold Metallic Gradient */
      background: linear-gradient(180deg, #fff9d6 0%, #f6d365 45%, #fda085 75%, #cf711f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      filter: drop-shadow(0 0 16px rgba(246, 211, 101, 0.75))
              drop-shadow(0 0 35px rgba(253, 160, 133, 0.45))
              drop-shadow(0 4px 10px rgba(0, 0, 0, 0.95));

      opacity: 0;
      will-change: transform, opacity, filter;
    }

    /* Slow Cinematic Zoom & Dissolve */
    .vintage-lyric.active {
      animation: cinematicZoom 4.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes cinematicZoom {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(10px);
        filter: blur(8px);
      }
      18% {
        opacity: 1;
        filter: blur(0px) drop-shadow(0 0 20px rgba(246, 211, 101, 0.85)) drop-shadow(0 0 45px rgba(253, 160, 133, 0.5));
      }
      82% {
        opacity: 1;
        transform: scale(1.06) translateY(-4px);
        filter: blur(0px) drop-shadow(0 0 22px rgba(246, 211, 101, 0.9));
      }
      100% {
        opacity: 0;
        transform: scale(1.12) translateY(-14px);
        filter: blur(6px);
      }
    }

    .lyric-sub {
      display: block;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-top: 10px;
      color: rgba(255, 243, 176, 0.85);
      -webkit-text-fill-color: rgba(255, 243, 176, 0.85);
      text-shadow: 0 0 12px rgba(246, 211, 101, 0.5);
    }

    /* Ambient Floating Amber Sparks */
    .amber-dust {
      position: fixed;
      border-radius: 50%;
      background: #ffd966;
      box-shadow: 0 0 8px #ffd966, 0 0 16px #fda085;
      pointer-events: none;
      z-index: 25;
      animation: floatAmber 6.5s ease-out forwards;
    }

    @keyframes floatAmber {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-380px) scale(1.3); }
    }

    /* 5. START OVERLAY (REQUIRED FOR SAFARI SOUND ACCESS) */
    #start-screen {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 7, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 200;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
      max-width: 330px;
    }

    #start-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: 'Koulen', sans-serif;
      font-size: 21px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #1a1005;
      border: 1px solid rgba(255, 249, 214, 0.8);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(246, 211, 101, 0.45);
      transition: transform 0.2s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    .audio-upload-container {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13.5px;
      color: #dfc299;
      background: rgba(30, 24, 18, 0.6);
      border: 1px dashed rgba(246, 211, 101, 0.5);
      border-radius: 25px;
      text-align: center;
      overflow: hidden;
    }
    .audio-upload-container input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 13.5px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      top: -9999px; left: -9999px;
      width: 10px; height: 10px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ============================================================== -->
  <!-- LOOPING MEDIA PLAYER (Accepts MP4 video or MP3 audio)          -->
  <!-- ============================================================== -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="music.mp4" type="video/mp4">
    <source src="music.mp3" type="audio/mp3">
    <source src="f12117c668798929d30d9a1344321ba7.mp4" type="video/mp4">
  </video>

  <!-- Widescreen Cinematic Letterbox -->
  <div class="letterbox-bar letterbox-top"></div>
  <div class="letterbox-bar letterbox-bottom"></div>

  <!-- Rain Canvas -->
  <canvas id="rain-canvas"></canvas>

  <!-- Vintage Film Grain -->
  <div id="film-overlay"></div>
  <div id="film-grain"></div>

  <!-- Stage for Centered Golden Typography -->
  <div id="lyric-stage"></div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="btn-group">
      <button id="start-btn" onclick="startCinema()">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
      
      <!-- Optional: Select video directly from your iPad Photos or Files -->
      <div class="audio-upload-container">
        <span id="audio-label">📁 ជ្រើសរើសវីដេអូ/ចម្រៀង</span>
        <input type="file" id="media-input" accept="video/*,audio/*" onchange="handleMediaUpload(this)">
      </div>
    </div>
    <p class="subtitle" id="status-text">(បទចម្រៀងនឹងចាក់បន្តបន្ទាប់ Loop ដោយមិនឈប់)</p>
  </div>

  <script>
    // ==============================================================
    // 1. CANVAS: RAIN & WET STREET CAR BOKEH LIGHTS
    // ==============================================================
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let raindrops = [];
    let bokehs = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initRain();
      initBokeh();
    }

    function initRain() {
      raindrops = [];
      const count = Math.floor(width * 0.4);
      for (let i = 0; i < count; i++) {
        raindrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 26 + 12,
          speed: Math.random() * 11 + 14,
          opacity: Math.random() * 0.4 + 0.15
        });
      }
    }

    function initBokeh() {
      bokehs = [];
      const colors = [
        'rgba(246, 211, 101, ',  // Streetlight Amber
        'rgba(255, 75, 75, ',    // Car Taillight Red
        'rgba(144, 205, 244, ',  // Wet Headlight Blue
        'rgba(255, 255, 255, '   // Xenon White
      ];
      for (let i = 0; i < 18; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.45 + Math.random() * (height * 0.45),
          radius: Math.random() * 45 + 18,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random() * 0.22 + 0.08,
          driftX: (Math.random() - 0.5) * 0.4,
          pulse: Math.random() * Math.PI
        });
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, width, height);

      bokehs.forEach(b => {
        b.x += b.driftX;
        b.pulse += 0.02;
        const currentAlpha = b.alpha + Math.sin(b.pulse) * 0.05;
        
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
        grad.addColorStop(0, b.color + currentAlpha + ')');
        grad.addColorStop(1, b.color + '0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        if (b.x < -b.radius) b.x = width + b.radius;
        if (b.x > width + b.radius) b.x = -b.radius;
      });

      ctx.lineWidth = 1.2;
      raindrops.forEach(r => {
        ctx.strokeStyle = `rgba(180, 215, 255, ${r.opacity})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.length);
        ctx.stroke();

        r.y += r.speed;
        r.x += 1;
        if (r.y > height) {
          r.y = -r.length;
          r.x = Math.random() * width;
        }
      });

      requestAnimationFrame(renderCanvas);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderCanvas();

    // ==============================================================
    // 2. KHMER LYRICS TIMELINE ("បើមេឃឈប់ភ្លៀង")
    // ==============================================================
    const TIMED_LYRICS = [
      { time: 0.2,  text: "តើអាចទេ បើខ្ញុំឈប់យំ", sub: "can i stop crying?" },
      { time: 3.8,  text: "បើមេឃឈប់ភ្លៀង តើខ្ញុំឈប់យំមែនទេ?", sub: "if rain stops, will tears dry?" },
      { time: 7.6,  text: "ឈប់ស្នេហ៍មាសមេ ឈប់ខ្វល់", sub: "stop loving you... stop caring" },
      { time: 10.4, text: "ឈប់ពាក់ព័ន្ធជិតឆ្ងាយ...", sub: "letting you go forever" },
      { time: 13.0, text: "ដើរចេញកុំមិនបាច់ប្រាប់ហេតុផល", sub: "walk away without goodbye" },
      { time: 16.6, text: "បងស្រក់ទឹកភ្នែក...", sub: "tears falling in the rain" },
      { time: 20.8, text: "បើមេឃឈប់ភ្លៀង តើខ្ញុំឈប់យំមែនទេ?", sub: "if rain stops, will i heal?" },
      { time: 24.8, text: "ស្មោះស្ម័គ្រស្នេហ៍គេ ស្រមៃគេមាន ២ ៣", sub: "loving you while you love another" },
      { time: 30.2, text: "សម្លាប់ក្តីសង្ឃឹមជាសន្សឹមៗ", sub: "slowly killing all my hope" },
      { time: 35.4, text: "បើឈប់ភ្លៀង បងចង់ឈប់ស្នេហ៍ស្រី...", sub: "when the rain ends, i will stop loving you" }
    ];

    let hasStarted = false;
    let loopTimeout = null;

    // Handles picking video/audio from iPad
    function handleMediaUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const player = document.getElementById('song-player');
        player.src = URL.createObjectURL(file);
        player.load();
        document.getElementById('audio-label').innerText = "✓ វីដេអូបានជ្រើសរើស!";
        document.getElementById('status-text').innerText = "រួចរាល់! ចុច 'ចាក់ចម្រៀង' ដើម្បីស្តាប់។";
      }
    }

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      document.getElementById('start-screen').style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true; // NON-STOP LOOPING ON AUDIO/VIDEO
      player.play().catch(e => console.log("Audio waiting on gesture:", e));

      // Event listener: guarantees audio and typography restart together seamlessly
      player.onended = () => {
        player.currentTime = 0;
        player.play();
        restartCinemaTimeline();
      };

      setInterval(spawnAmberDust, 260);

      // Start Cinema Timeline
      playCinemaTimeline();
    }

    function playCinemaTimeline() {
      const stage = document.getElementById('lyric-stage');

      TIMED_LYRICS.forEach(item => {
        setTimeout(() => {
          stage.innerHTML = ''; // Keep only 1 phrase centered at a time

          const el = document.createElement('div');
          el.className = 'vintage-lyric active';
          el.innerHTML = `
            ${item.text}
            <span class="lyric-sub">${item.sub}</span>
          `;
          stage.appendChild(el);
        }, item.time * 1000);
      });

      // NON-STOP LOOP: Resets the lyrics sequence every 40.5s
      loopTimeout = setTimeout(() => {
        restartCinemaTimeline();
      }, 40500);
    }

    function restartCinemaTimeline() {
      clearTimeout(loopTimeout);
      const stage = document.getElementById('lyric-stage');
      stage.innerHTML = '';
      
      const player = document.getElementById('song-player');
      // If loop was slightly desynced, align back to 0
      if (player.currentTime >= 39) {
        player.currentTime = 0;
      }
      playCinemaTimeline();
    }

    function spawnAmberDust() {
      const dust = document.createElement('div');
      dust.className = 'amber-dust';
      const size = Math.random() * 4 + 2;
      dust.style.width = `${size}px`;
      dust.style.height = `${size}px`;

      const x = Math.random() * window.innerWidth;
      const y = window.innerHeight * 0.75 + Math.random() * 100;

      dust.style.left = `${x}px`;
      dust.style.top = `${y}px`;
      document.body.appendChild(dust);

      setTimeout(() => dust.remove(), 6500);
    }
  </script>
</body>
</html>
