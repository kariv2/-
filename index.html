<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #04060a;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
    }

    /* 1. CINEMATIC CANVAS (Rain, Droplets, Window & Man Silhouette) */
    #art-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background-color: #04060a;
    }

    /* 2. LETTERBOX & VINTAGE GRAIN */
    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 5vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.15;
      pointer-events: none;
      z-index: 15;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.13; }
      50% { opacity: 0.18; }
      100% { opacity: 0.14; }
    }

    /* ==========================================================
       3. GLOWING GOLDEN KHMER WORD-BY-WORD LYRICS
       ========================================================== */
    #lyric-container {
      position: fixed;
      left: 0; right: 0;
      bottom: 9vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 20px;
    }

    .lyric-box {
      text-align: center;
      max-width: min(92vw, 850px);
      min-height: 90px;
    }

    .lyric-text {
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
      font-size: clamp(24px, 3.8vw, 42px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #fffbe6 0%, #ffd166 45%, #f78c6c 80%, #d46517 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.9))
              drop-shadow(0 0 35px rgba(247, 140, 108, 0.55))
              drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95));
    }

    .word-token {
      display: inline-block;
      opacity: 0;
      transform: translateY(7px) scale(0.92);
      animation: wordPop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
      margin: 0 4px;
    }
    @keyframes wordPop {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lyric-sub {
      display: block;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: clamp(13px, 1.8vw, 18px);
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-top: 8px;
      color: rgba(255, 240, 180, 0.85);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.2s;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .amber-ember {
      position: fixed;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166, 0 0 16px #f78c6c;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 6s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-360px); }
    }

    /* ==========================================================
       4. GUARANTEED TAPPABLE START OVERLAY (IPAD COMPLIANT)
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(3, 4, 7, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    #start-btn {
      padding: 18px 46px;
      font-family: 'Koulen', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffd166, #f78c6c);
      color: #1a0f05;
      border: 1px solid rgba(255, 249, 214, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.95); }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 14px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Media Player with your video file -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>

  <!-- Canvas for Scene -->
  <canvas id="art-canvas"></canvas>
  <div id="film-grain"></div>

  <!-- Golden Lyrics Stage -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen with guaranteed click listener -->
  <div id="start-screen">
    <button id="start-btn">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
    <p class="subtitle">បើកសំឡេងឡើងដើម្បីស្តាប់បទ "បើមេឃឈប់ភ្លៀង"</p>
  </div>

  <script>
    // ==============================================================
    // 1. SCENE ENGINE: MAN SITTING AT THE RAINY WINDOW
    // ==============================================================
    const canvas = document.getElementById('art-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let rain = [];
    let bokehs = [];
    let glassDrops = [];
    let steamTick = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    function initScene() {
      // Fast outside rain streaks
      rain = [];
      for (let i = 0; i < Math.floor(width * 0.3); i++) {
        rain.push({
          x: Math.random() * width,
          y: Math.random() * height,
          l: Math.random() * 24 + 14,
          s: Math.random() * 12 + 14,
          a: Math.random() * 0.35 + 0.15
        });
      }

      // Distant city streetlights
      bokehs = [];
      const colors = ['rgba(255,209,102,', 'rgba(255,82,82,', 'rgba(144,205,244,'];
      for (let i = 0; i < 16; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.25 + Math.random() * (height * 0.45),
          r: Math.random() * 45 + 20,
          c: colors[Math.floor(Math.random() * colors.length)],
          a: Math.random() * 0.25 + 0.08,
          dx: (Math.random() - 0.5) * 0.3,
          p: Math.random() * Math.PI
        });
      }

      // Trickling droplets on window pane
      glassDrops = [];
      for (let i = 0; i < 35; i++) {
        glassDrops.push({
          x: width * 0.15 + Math.random() * (width * 0.7),
          y: Math.random() * (height * 0.7),
          r: Math.random() * 2.5 + 1.2,
          s: Math.random() * 0.7 + 0.15
        });
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      // --- LAYER 1: RAINY OUTSIDE NIGHT ---
      bokehs.forEach(b => {
        b.x += b.dx;
        b.p += 0.02;
        const alpha = b.a + Math.sin(b.p) * 0.05;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.c + alpha + ')');
        grad.addColorStop(1, b.c + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Outside rain
      ctx.lineWidth = 1.2;
      rain.forEach(r => {
        ctx.strokeStyle = `rgba(160,205,255,${r.a})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.l);
        ctx.stroke();
        r.y += r.s;
        r.x += 1;
        if (r.y > height) { r.y = -r.l; r.x = Math.random() * width; }
      });

      // Trickling window drops
      glassDrops.forEach(d => {
        ctx.fillStyle = 'rgba(210,235,255,0.7)';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        d.y += d.s;
        if (d.y > height * 0.72) {
          d.y = height * 0.08;
          d.x = width * 0.15 + Math.random() * (width * 0.7);
        }
      });

      // --- LAYER 2: ROOM INTERIOR SILHOUETTE & WINDOW FRAME ---
      const winL = width * 0.15;
      const winR = width * 0.85;
      const winTop = height * 0.08;
      const winBottom = height * 0.72;

      // Dark Room Walls around window
      ctx.fillStyle = '#04060a';
      ctx.fillRect(0, 0, winL, height);
      ctx.fillRect(winR, 0, width - winR, height);
      ctx.fillRect(0, 0, width, winTop);
      ctx.fillRect(0, winBottom, width, height - winBottom);

      // Wooden Window Sill Ledge
      ctx.fillStyle = '#111824';
      ctx.fillRect(winL - 20, winBottom - 8, (winR - winL) + 40, 24);

      // Window crossbars
      ctx.fillStyle = '#060a12';
      const midX = (winL + winR) / 2;
      ctx.fillRect(midX - 5, winTop, 10, winBottom - winTop);
      ctx.fillRect(winL, (winTop + winBottom) / 2 - 4, winR - winL, 8);

      // --- LAYER 3: SILHOUETTE OF THE MAN SITTING AT THE WINDOW ---
      // Positioned on the right side of the window looking left into rain
      const manX = winR - (width > 800 ? 150 : 90);
      const manY = winBottom + 6;
      const scale = width > 800 ? 1.0 : 0.7;

      ctx.save();
      ctx.translate(manX, manY);
      ctx.scale(scale, scale);

      // Warm interior lamp rim light on his back
      ctx.strokeStyle = 'rgba(255,183,77,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(35, 0);
      ctx.bezierCurveTo(45, -70, 40, -120, 20, -165);
      ctx.stroke();

      // Body silhouette (sitting with knees drawn up, leaning on the sill)
      ctx.fillStyle = '#020306';
      ctx.beginPath();
      ctx.moveTo(-110, 0); // Legs on sill
      ctx.bezierCurveTo(-100, -75, -60, -95, 0, -90);
      ctx.bezierCurveTo(30, -90, 45, -50, 45, 0); // Hip
      ctx.closePath();
      ctx.fill();

      // Torso leaning forward
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.bezierCurveTo(40, -90, 30, -150, -5, -170); // Back
      ctx.bezierCurveTo(-35, -150, -35, -80, -20, 0); // Chest
      ctx.closePath();
      ctx.fill();

      // Arm resting on the sill & hand supporting chin
      ctx.beginPath();
      ctx.moveTo(-15, -110);
      ctx.bezierCurveTo(-50, -85, -75, -50, -85, -10); // Elbow on sill
      ctx.lineTo(-65, -10);
      ctx.bezierCurveTo(-55, -45, -30, -80, -5, -100);
      ctx.closePath();
      ctx.fill();

      // Forearm up to cheek
      ctx.beginPath();
      ctx.moveTo(-85, -10);
      ctx.bezierCurveTo(-80, -50, -60, -110, -35, -145);
      ctx.lineTo(-25, -140);
      ctx.bezierCurveTo(-45, -100, -65, -50, -65, -10);
      ctx.closePath();
      ctx.fill();

      // Head tilted gazing out window
      ctx.beginPath();
      ctx.arc(-22, -168, 22, 0, Math.PI * 2);
      ctx.fill();

      // Messy hair profile
      ctx.beginPath();
      ctx.moveTo(-22, -190);
      ctx.bezierCurveTo(-45, -188, -48, -160, -40, -145);
      ctx.bezierCurveTo(-35, -155, -20, -160, -10, -150);
      ctx.bezierCurveTo(0, -170, -5, -192, -22, -190);
      ctx.fill();

      // Coffee mug on sill
      ctx.fillStyle = '#1c283c';
      ctx.fillRect(-120, -22, 20, 20);
      ctx.strokeStyle = '#4a6288';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-120, -22, 20, 20);

      // Steam rising
      steamTick += 0.04;
      ctx.strokeStyle = 'rgba(255,230,180,0.4)';
      ctx.beginPath();
      ctx.moveTo(-110, -24);
      ctx.quadraticCurveTo(-110 + Math.sin(steamTick) * 6, -36, -110, -48);
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();

    // ==============================================================
    // 2. TIMED KHMER LYRICS ("បើមេឃឈប់ភ្លៀង")
    // ==============================================================
    const TIMED_LYRICS = [
      { time: 0.2,  text: "តើអាចទេ បើ ខ្ញុំ ឈប់យំ", duration: 3.2, sub: "can i stop crying?" },
      { time: 3.8,  text: "បើ មេឃ ឈប់ភ្លៀង តើខ្ញុំ ឈប់យំ មែនទេ?", duration: 3.4, sub: "if rain stops, will tears dry?" },
      { time: 7.6,  text: "ឈប់ស្នេហ៍ មាសមេ ឈប់ខ្វល់", duration: 2.6, sub: "stop loving you..." },
      { time: 10.4, text: "ឈប់ ពាក់ព័ន្ធ ជិតឆ្ងាយ...", duration: 2.4, sub: "letting you go forever" },
      { time: 13.0, text: "ដើរចេញ ក៏ មិនបាច់ ប្រាប់ហេតុផល", duration: 3.2, sub: "walk away without goodbye" },
      { time: 16.6, text: "បង ស្រក់ ទឹកភ្នែក...", duration: 3.4, sub: "tears falling in the rain" },
      { time: 20.8, text: "បើ មេឃ ឈប់ភ្លៀង តើខ្ញុំ ឈប់យំ មែនទេ?", duration: 3.6, sub: "if rain stops, will i heal?" },
      { time: 24.8, text: "ស្មោះស្ម័គ្រ ស្នេហ៍គេ ស្រមៃ គេមាន ២ ៣", duration: 4.8, sub: "loving you while you love another" },
      { time: 30.2, text: "សម្លាប់ ក្តីសង្ឃឹម ជាសន្សឹមៗ ចង់ស្រលាញ់ អ្នកថ្មី", duration: 4.8, sub: "slowly killing all my hope" },
      { time: 35.4, text: "បើ ឈប់ភ្លៀង បងចង់ ឈប់ស្នេហ៍ ស្រី...", duration: 4.4, sub: "when the rain ends, i will stop loving you" }
    ];

    let hasStarted = false;
    let loopTimeout = null;

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      setInterval(spawnAmberEmber, 320);
      playWordTimeline();
    }

    // Direct touch & click bindings for 100% iPad button response
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startCinema);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startCinema();
    });

    function playWordTimeline() {
      const box = document.getElementById('lyric-box');

      TIMED_LYRICS.forEach(item => {
        setTimeout(() => {
          renderWordByWord(item.text, item.duration, item.sub);
        }, item.time * 1000);
      });

      loopTimeout = setTimeout(() => {
        restartTimeline();
      }, 40500);
    }

    function renderWordByWord(fullText, vocalDuration, subText) {
      const box = document.getElementById('lyric-box');
      box.innerHTML = '';

      const lineContainer = document.createElement('div');
      lineContainer.className = 'lyric-text';
      box.appendChild(lineContainer);

      const words = fullText.split(' ');
      const perWordDelay = (vocalDuration * 1000) / words.length;

      words.forEach((word, index) => {
        setTimeout(() => {
          const span = document.createElement('span');
          span.className = 'word-token';
          span.textContent = word;
          lineContainer.appendChild(span);

          if (index === words.length - 1) {
            const sub = document.createElement('span');
            sub.className = 'lyric-sub';
            sub.textContent = subText;
            box.appendChild(sub);
          }
        }, index * perWordDelay);
      });
    }

    function restartTimeline() {
      clearTimeout(loopTimeout);
      const box = document.getElementById('lyric-box');
      box.innerHTML = '';
      const player = document.getElementById('song-player');
      if (player.currentTime >= 39) player.currentTime = 0;
      playWordTimeline();
    }

    function spawnAmberEmber() {
      const ember = document.createElement('div');
      ember.className = 'amber-ember';
      const size = Math.random() * 3.5 + 2;
      ember.style.width = `${size}px`;
      ember.style.height = `${size}px`;
      ember.style.left = `${Math.random() * window.innerWidth}px`;
      ember.style.top = `${window.innerHeight * 0.75 + Math.random() * 100}px`;
      document.body.appendChild(ember);
      setTimeout(() => ember.remove(), 6000);
    }
  </script>
</body>
</html>
