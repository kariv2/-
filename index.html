<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <!-- Google Fonts for Khmer Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #06070a;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
    }

    /* 1. CINEMATIC CANVAS (Window, Brick Building, Man & Curtain) */
    #art-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background-color: #06070a;
    }

    /* 2. LETTERBOX & VINTAGE GRAIN */
    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 4.5vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.14;
      pointer-events: none;
      z-index: 15;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.12; }
      50% { opacity: 0.16; }
      100% { opacity: 0.13; }
    }

    /* ==========================================================
       3. BOTTOM PURE KHMER LYRICS (SAD & SUBDUED)
       ========================================================== */
    #lyric-container {
      position: fixed;
      left: 0; right: 0;
      bottom: 6.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      padding: 0 20px;
    }

    .lyric-box {
      text-align: center;
      min-height: 65px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .word-token {
      display: inline-block;
      color: #cfc8b8 !important; /* Muted ash-cream */
      font-family: 'Koulen', 'Kantumruy Pro', cursive, sans-serif;
      font-size: clamp(23px, 3.4vw, 38px);
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 0 5px;
      opacity: 0.92;
      text-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.95),
        0 0 14px rgba(185, 175, 155, 0.28);
      animation: wordSadFade 0.3s ease-out both;
    }

    @keyframes wordSadFade {
      0% {
        opacity: 0;
        transform: translateY(6px);
        filter: blur(2px);
      }
      100% {
        opacity: 0.92;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    .amber-ember {
      position: fixed;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166, 0 0 16px #f78c6c;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 6s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-340px); }
    }

    /* ==========================================================
       4. START OVERLAY
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(3, 4, 7, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    #start-btn {
      padding: 18px 46px;
      font-family: 'Koulen', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffd166, #f78c6c);
      color: #1a0f05;
      border: 1px solid rgba(255, 249, 214, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.95); }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 14px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>

  <!-- Scene Canvas matching reference photo -->
  <canvas id="art-canvas"></canvas>
  <div id="film-grain"></div>

  <!-- Bottom Khmer Lyrics -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <button id="start-btn">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
    <p class="subtitle">បើកសំឡេងឡើងដើម្បីស្តាប់បទ "បើមេឃឈប់ភ្លៀង"</p>
  </div>

  <script>
    // ==============================================================
    // 1. SCENE ENGINE: COMPOSITION MATCHING YOUR PHOTO
    // ==============================================================
    const canvas = document.getElementById('art-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let rain = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initRain();
    }

    function initRain() {
      rain = [];
      const rainCount = Math.floor(width * 0.28);
      for (let i = 0; i < rainCount; i++) {
        rain.push({
          x: Math.random() * (width * 0.48), // Rain falls only outside the window (left half)
          y: Math.random() * height,
          l: Math.random() * 22 + 12,
          s: Math.random() * 11 + 13,
          a: Math.random() * 0.35 + 0.15
        });
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      const winWidth = width * 0.44;  // Window occupies left ~44%
      const curtainLeft = width * 0.48; // Curtain occupies right half

      // --- 1. OUTSIDE RAINY DAY VIEW (RED BRICK BUILDING) ---
      // Overcast rainy sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#545d68');
      skyGrad.addColorStop(1, '#3b434d');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, winWidth, height);

      // Red Brick Wall Outside (matching reference photo)
      const brickL = width * 0.01;
      const brickR = width * 0.28;
      ctx.fillStyle = '#6e382b'; // Moody red brick
      ctx.fillRect(brickL, 0, brickR - brickL, height);

      // Brick rows & texture
      ctx.strokeStyle = '#52291f';
      ctx.lineWidth = 1;
      for (let y = 0; y < height; y += 14) {
        ctx.beginPath();
        ctx.moveTo(brickL, y);
        ctx.lineTo(brickR, y);
        ctx.stroke();
      }

      // Arched brick windows outside in background
      ctx.fillStyle = '#1c2128';
      ctx.fillRect(brickL + 20, height * 0.15, 60, 90);
      ctx.fillRect(brickL + 20, height * 0.52, 60, 90);
      // Window panes outside
      ctx.fillStyle = '#3a4452';
      ctx.fillRect(brickL + 26, height * 0.18, 48, 40);
      ctx.fillRect(brickL + 26, height * 0.55, 48, 40);

      // Slanted Rain falling outside the window
      ctx.lineWidth = 1.1;
      rain.forEach(r => {
        ctx.strokeStyle = `rgba(180, 215, 255, ${r.a})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.l);
        ctx.stroke();
        r.y += r.s;
        r.x += 0.8;
        if (r.y > height) {
          r.y = -r.l;
          r.x = Math.random() * winWidth;
        }
      });

      // --- 2. TALL WHITE WINDOW FRAME (Matching photo structure) ---
      ctx.fillStyle = '#cfc7b8'; // Off-white painted wood frame
      ctx.fillRect(winWidth - 28, 0, 28, height); // Main vertical frame
      // Frosted / glass dividers
      ctx.fillStyle = '#9aa1ab';
      ctx.fillRect(winWidth - 110, height * 0.12, 80, height * 0.38);
      ctx.strokeStyle = '#cfc7b8';
      ctx.lineWidth = 6;
      ctx.strokeRect(winWidth - 110, height * 0.12, 80, height * 0.38);

      // --- 3. THE MAN SITTING ON THE WINDOW SILL (Profile facing left) ---
      const manX = winWidth - 10;
      const manY = height * 0.68;
      const scale = width > 800 ? 1.05 : 0.78;

      ctx.save();
      ctx.translate(manX, manY);
      ctx.scale(scale, scale);

      // Soft overcast window light reflecting on his face profile
      ctx.strokeStyle = 'rgba(215, 225, 240, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-45, -170); // Hair tip
      ctx.lineTo(-58, -148); // Forehead
      ctx.lineTo(-64, -135); // Nose tip
      ctx.lineTo(-58, -128); // Lips
      ctx.lineTo(-56, -118); // Chin
      ctx.lineTo(-40, -100); // Jawline
      ctx.stroke();

      // Head silhouette
      ctx.fillStyle = '#080a0e';
      ctx.beginPath();
      ctx.moveTo(-45, -170);
      ctx.bezierCurveTo(-30, -195, 10, -190, 25, -165);
      ctx.bezierCurveTo(35, -140, 30, -110, 15, -95);
      ctx.lineTo(-30, -95);
      ctx.bezierCurveTo(-50, -100, -65, -130, -45, -170);
      ctx.fill();

      // Shaggy dark wavy hair (matching photo)
      ctx.fillStyle = '#050608';
      ctx.beginPath();
      ctx.moveTo(-60, -155);
      ctx.bezierCurveTo(-70, -145, -60, -130, -50, -125); // Fringe over temple
      ctx.bezierCurveTo(-35, -115, -25, -130, -25, -145);
      ctx.bezierCurveTo(-20, -175, 5, -185, -20, -195);
      ctx.bezierCurveTo(-45, -200, -65, -175, -60, -155);
      ctx.fill();

      // Body / Black long-sleeve sweater (folded sideways on the sill)
      ctx.fillStyle = '#0a0d12';
      ctx.beginPath();
      ctx.moveTo(15, -95);
      ctx.bezierCurveTo(45, -60, 50, 0, 50, 80); // Back
      ctx.lineTo(-120, 80); // Lap
      ctx.bezierCurveTo(-115, 20, -75, -20, -35, -70); // Arm & chest
      ctx.closePath();
      ctx.fill();

      // Clasped hands resting on lap (matching photo)
      ctx.fillStyle = '#1e2430';
      ctx.beginPath();
      ctx.ellipse(-85, 38, 16, 10, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // --- 4. HEAVY GOLDEN-MUSTARD CURTAIN (Right side of room) ---
      // Dark room base shadow
      ctx.fillStyle = '#06070a';
      ctx.fillRect(curtainLeft - 20, 0, width - curtainLeft + 20, height);

      // Rich draped curtain folds (olive/mustard tones from photo)
      const curtainFolds = [
        { x: curtainLeft, w: width * 0.10, col1: '#4a401c', col2: '#1f1a0a' },
        { x: curtainLeft + width * 0.08, w: width * 0.12, col1: '#5c4e20', col2: '#181406' },
        { x: curtainLeft + width * 0.18, w: width * 0.14, col1: '#423714', col2: '#0e0b03' },
        { x: curtainLeft + width * 0.30, w: width * 0.25, col1: '#2e260c', col2: '#050401' }
      ];

      curtainFolds.forEach(f => {
        const foldGrad = ctx.createLinearGradient(f.x, 0, f.x + f.w, 0);
        foldGrad.addColorStop(0, f.col2);
        foldGrad.addColorStop(0.35, f.col1);
        foldGrad.addColorStop(1, f.col2);
        ctx.fillStyle = foldGrad;
        ctx.fillRect(f.x, 0, f.w, height);
      });

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();

    // ==============================================================
    // 2. TIMED KHMER LYRICS (WORD-BY-WORD ONLY IN KHMER)
    // ==============================================================
    const PHRASES = [
      { id: 1, start: 0.1, end: 3.6, words: [
        { t: 0.1, w: "អាចទេ" }, { t: 1.2, w: "បើ" }, { t: 1.5, w: "ខ្ញុំ" }, { t: 2.0, w: "ឈប់" }, { t: 2.5, w: "យំ" }
      ]},
      { id: 2, start: 3.8, end: 7.5, words: [
        { t: 3.8, w: "បើ" }, { t: 4.1, w: "មេឃ" }, { t: 4.5, w: "ឈប់" }, { t: 4.8, w: "ភ្លៀង" },
        { t: 5.4, w: "តើ" }, { t: 5.7, w: "ខ្ញុំ" }, { t: 6.1, w: "ឈប់" }, { t: 6.4, w: "យំ" }, { t: 6.8, w: "មែនទេ?" }
      ]},
      { id: 3, start: 7.8, end: 10.0, words: [
        { t: 7.8, w: "ឈប់" }, { t: 8.2, w: "ស្នេហ៍" }, { t: 8.6, w: "មាស" }, { t: 9.0, w: "មេ" }
      ]},
      { id: 4, start: 10.2, end: 12.8, words: [
        { t: 10.2, w: "ឈប់" }, { t: 10.6, w: "ខ្វល់" }, { t: 11.1, w: "និង" }, { t: 11.4, w: "ឈប់" },
        { t: 11.7, w: "ពាក់ព័ន្ធ" }, { t: 12.1, w: "ជិត" }, { t: 12.5, w: "ឆ្ងាយ" }
      ]},
      { id: 5, start: 13.0, end: 15.4, words: [
        { t: 13.0, w: "ដើរចេញ" }, { t: 13.5, w: "ក៏" }, { t: 13.8, w: "មិនបាច់" }, { t: 14.3, w: "ប្រាប់" }, { t: 14.8, w: "ហេតុផល" }
      ]},
      { id: 6, start: 15.6, end: 18.0, words: [
        { t: 15.6, w: "ហើយ" }, { t: 15.9, w: "អូន" }, { t: 16.2, w: "ក៏" }, { t: 16.5, w: "មិនបាច់" },
        { t: 17.0, w: "ត្រូវ" }, { t: 17.3, w: "ស្តាប់" }, { t: 17.7, w: "ហេតុផល" }
      ]},
      { id: 7, start: 18.2, end: 20.6, words: [
        { t: 18.2, w: "បង" }, { t: 18.6, w: "ស្រក់" }, { t: 19.1, w: "ទឹកភ្នែក..." }
      ]},
      { id: 8, start: 20.8, end: 24.6, words: [
        { t: 20.8, w: "បើ" }, { t: 21.1, w: "មេឃ" }, { t: 21.5, w: "ឈប់" }, { t: 21.8, w: "ភ្លៀង" },
        { t: 22.4, w: "តើ" }, { t: 22.7, w: "ខ្ញុំ" }, { t: 23.1, w: "ឈប់" }, { t: 23.4, w: "យំ" }, { t: 23.8, w: "មែនទេ?" }
      ]},
      { id: 9, start: 24.8, end: 26.6, words: [
        { t: 24.8, w: "ស្មោះ" }, { t: 25.2, w: "ស្ម័គ្រ" }, { t: 25.6, w: "ស្នេហ៍" }, { t: 26.1, w: "គេ" }
      ]},
      { id: 10, start: 26.8, end: 30.4, words: [
        { t: 26.8, w: "ស្រមៃ" }, { t: 27.3, w: "មើល" }, { t: 27.7, w: "គេ" }, { t: 28.2, w: "ទាក់ទង" }, { t: 28.8, w: "ម្តង" }, { t: 29.3, w: "២-៣" }
      ]},
      { id: 11, start: 30.6, end: 33.0, words: [
        { t: 30.6, w: "សម្លាប់" }, { t: 31.1, w: "ក្តី" }, { t: 31.5, w: "សង្ឃឹម" }, { t: 32.1, w: "ជា" }, { t: 32.6, w: "សន្សឹមៗ" }
      ]},
      { id: 12, start: 33.2, end: 35.6, words: [
        { t: 33.2, w: "ចង់" }, { t: 33.7, w: "ស្រឡាញ់" }, { t: 34.2, w: "អ្នក" }, { t: 34.7, w: "ថ្មី" }
      ]},
      { id: 13, start: 35.8, end: 39.4, words: [
        { t: 35.8, w: "បើ" }, { t: 36.2, w: "ឈប់" }, { t: 36.6, w: "ភ្លៀង" }, { t: 37.1, w: "បង" },
        { t: 37.5, w: "ចង់" }, { t: 37.9, w: "ឈប់" }, { t: 38.3, w: "ស្នេហ៍" }, { t: 38.7, w: "ស្រី..." }
      ]}
    ];

    let hasStarted = false;
    let currentPhraseId = null;
    let renderedWords = new Set();
    let syncTimer = null;

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      setInterval(spawnAmberEmber, 320);

      const clockStart = performance.now();

      syncTimer = setInterval(() => {
        let curTime = 0;
        if (!player.paused && player.currentTime > 0) {
          curTime = player.currentTime;
        } else {
          curTime = (performance.now() - clockStart) / 1000;
        }

        handleWordByWordSync(curTime);

        if (curTime >= 39.5) {
          currentPhraseId = null;
          renderedWords.clear();
          player.currentTime = 0;
          player.play().catch(() => {});
        }
      }, 25);
    }

    function handleWordByWordSync(currentTime) {
      const box = document.getElementById('lyric-box');
      const activePhrase = PHRASES.find(p => currentTime >= p.start && currentTime <= p.end);

      if (activePhrase) {
        if (currentPhraseId !== activePhrase.id) {
          currentPhraseId = activePhrase.id;
          box.innerHTML = '';
        }

        activePhrase.words.forEach((wordObj, idx) => {
          const wordKey = `${activePhrase.id}_${idx}`;
          if (currentTime >= wordObj.t && !renderedWords.has(wordKey)) {
            renderedWords.add(wordKey);

            const span = document.createElement('span');
            span.className = 'word-token';
            span.textContent = wordObj.w;
            box.appendChild(span);
          }
        });
      } else {
        if (currentPhraseId !== null) {
          currentPhraseId = null;
          box.innerHTML = '';
        }
      }
    }

    // Direct iPad Touch Event Listener
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startCinema);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startCinema();
    });

    function spawnAmberEmber() {
      const ember = document.createElement('div');
      ember.className = 'amber-ember';
      const size = Math.random() * 3.5 + 2;
      ember.style.width = `${size}px`;
      ember.style.height = `${size}px`;
      ember.style.left = `${Math.random() * window.innerWidth}px`;
      ember.style.top = `${window.innerHeight * 0.72 + Math.random() * 100}px`;
      document.body.appendChild(ember);
      setTimeout(() => ember.remove(), 6000);
    }
  </script>
</body>
</html>
