<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <!-- Google Fonts for Khmer Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@600;700&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #04060a;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
    }

    /* 1. CANVAS (Rain, Droplets, Window & Man Silhouette) */
    #art-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background-color: #04060a;
    }

    /* 2. CINEMATIC LETTERBOX & VINTAGE GRAIN */
    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 5vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.15;
      pointer-events: none;
      z-index: 15;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.13; }
      50% { opacity: 0.18; }
      100% { opacity: 0.14; }
    }

    /* ==========================================================
       3. CENTERED PURE KHMER WORD-BY-WORD LYRICS
       ========================================================== */
    #lyric-container {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(94vw, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      padding: 0 16px;
    }

    .lyric-box {
      text-align: center;
      min-height: 85px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    /* Word Pop-in with Glowing Gold Bloom */
    .word-token {
      display: inline-block;
      color: #ffda79 !important;
      font-family: 'Koulen', 'Kantumruy Pro', cursive, sans-serif;
      font-size: clamp(28px, 4.4vw, 52px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.03em;
      margin: 0 6px;
      text-shadow: 
        0 0 14px rgba(255, 218, 121, 0.95),
        0 0 32px rgba(255, 159, 67, 0.75),
        0 0 50px rgba(247, 140, 108, 0.5),
        0 3px 8px rgba(0, 0, 0, 0.95);
      animation: wordPop 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.25) both;
    }

    @keyframes wordPop {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.85);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .amber-ember {
      position: fixed;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166, 0 0 16px #f78c6c;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 6s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-360px); }
    }

    /* ==========================================================
       4. START OVERLAY (IPAD COMPLIANT)
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(3, 4, 7, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    #start-btn {
      padding: 18px 46px;
      font-family: 'Koulen', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffd166, #f78c6c);
      color: #1a0f05;
      border: 1px solid rgba(255, 249, 214, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.95); }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 14px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Media Player with your video file -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>

  <!-- Canvas Scene: Man Sitting in Window During Rain -->
  <canvas id="art-canvas"></canvas>
  <div id="film-grain"></div>

  <!-- Golden Center Lyrics Stage -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <button id="start-btn">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
    <p class="subtitle">បើកសំឡេងឡើងដើម្បីស្តាប់បទ "បើមេឃឈប់ភ្លៀង"</p>
  </div>

  <script>
    // ==============================================================
    // 1. SCENE ENGINE: MAN SITTING AT THE RAINY WINDOW
    // ==============================================================
    const canvas = document.getElementById('art-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let rain = [];
    let bokehs = [];
    let glassDrops = [];
    let steamTick = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    function initScene() {
      rain = [];
      for (let i = 0; i < Math.floor(width * 0.3); i++) {
        rain.push({
          x: Math.random() * width,
          y: Math.random() * height,
          l: Math.random() * 24 + 14,
          s: Math.random() * 12 + 14,
          a: Math.random() * 0.35 + 0.15
        });
      }

      bokehs = [];
      const colors = ['rgba(255,209,102,', 'rgba(255,82,82,', 'rgba(144,205,244,'];
      for (let i = 0; i < 16; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.25 + Math.random() * (height * 0.45),
          r: Math.random() * 45 + 20,
          c: colors[Math.floor(Math.random() * colors.length)],
          a: Math.random() * 0.25 + 0.08,
          dx: (Math.random() - 0.5) * 0.3,
          p: Math.random() * Math.PI
        });
      }

      glassDrops = [];
      for (let i = 0; i < 35; i++) {
        glassDrops.push({
          x: width * 0.15 + Math.random() * (width * 0.7),
          y: Math.random() * (height * 0.7),
          r: Math.random() * 2.5 + 1.2,
          s: Math.random() * 0.7 + 0.15
        });
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      // Outside Bokeh Lights
      bokehs.forEach(b => {
        b.x += b.dx;
        b.p += 0.02;
        const alpha = b.a + Math.sin(b.p) * 0.05;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.c + alpha + ')');
        grad.addColorStop(1, b.c + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Outside Rain
      ctx.lineWidth = 1.2;
      rain.forEach(r => {
        ctx.strokeStyle = `rgba(160,205,255,${r.a})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.l);
        ctx.stroke();
        r.y += r.s;
        r.x += 1;
        if (r.y > height) { r.y = -r.l; r.x = Math.random() * width; }
      });

      // Trickling Window Droplets
      glassDrops.forEach(d => {
        ctx.fillStyle = 'rgba(210,235,255,0.7)';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        d.y += d.s;
        if (d.y > height * 0.72) {
          d.y = height * 0.08;
          d.x = width * 0.15 + Math.random() * (width * 0.7);
        }
      });

      // Room Interior Walls & Window Frame
      const winL = width * 0.15;
      const winR = width * 0.85;
      const winTop = height * 0.08;
      const winBottom = height * 0.72;

      ctx.fillStyle = '#04060a';
      ctx.fillRect(0, 0, winL, height);
      ctx.fillRect(winR, 0, width - winR, height);
      ctx.fillRect(0, 0, width, winTop);
      ctx.fillRect(0, winBottom, width, height - winBottom);

      // Wooden Sill
      ctx.fillStyle = '#111824';
      ctx.fillRect(winL - 20, winBottom - 8, (winR - winL) + 40, 24);

      // Crossbars
      ctx.fillStyle = '#060a12';
      const midX = (winL + winR) / 2;
      ctx.fillRect(midX - 5, winTop, 10, winBottom - winTop);
      ctx.fillRect(winL, (winTop + winBottom) / 2 - 4, winR - winL, 8);

      // Silhouette of Man Sitting on Window Sill
      const manX = winR - (width > 800 ? 150 : 90);
      const manY = winBottom + 6;
      const scale = width > 800 ? 1.0 : 0.7;

      ctx.save();
      ctx.translate(manX, manY);
      ctx.scale(scale, scale);

      ctx.strokeStyle = 'rgba(255,183,77,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(35, 0);
      ctx.bezierCurveTo(45, -70, 40, -120, 20, -165);
      ctx.stroke();

      ctx.fillStyle = '#020306';
      ctx.beginPath();
      ctx.moveTo(-110, 0);
      ctx.bezierCurveTo(-100, -75, -60, -95, 0, -90);
      ctx.bezierCurveTo(30, -90, 45, -50, 45, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.bezierCurveTo(40, -90, 30, -150, -5, -170);
      ctx.bezierCurveTo(-35, -150, -35, -80, -20, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-15, -110);
      ctx.bezierCurveTo(-50, -85, -75, -50, -85, -10);
      ctx.lineTo(-65, -10);
      ctx.bezierCurveTo(-55, -45, -30, -80, -5, -100);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-85, -10);
      ctx.bezierCurveTo(-80, -50, -60, -110, -35, -145);
      ctx.lineTo(-25, -140);
      ctx.bezierCurveTo(-45, -100, -65, -50, -65, -10);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(-22, -168, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-22, -190);
      ctx.bezierCurveTo(-45, -188, -48, -160, -40, -145);
      ctx.bezierCurveTo(-35, -155, -20, -160, -10, -150);
      ctx.bezierCurveTo(0, -170, -5, -192, -22, -190);
      ctx.fill();

      // Mug & steam
      ctx.fillStyle = '#1c283c';
      ctx.fillRect(-120, -22, 20, 20);
      ctx.strokeStyle = '#4a6288';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-120, -22, 20, 20);

      steamTick += 0.04;
      ctx.strokeStyle = 'rgba(255,230,180,0.4)';
      ctx.beginPath();
      ctx.moveTo(-110, -24);
      ctx.quadraticCurveTo(-110 + Math.sin(steamTick) * 6, -36, -110, -48);
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();

    // ==============================================================
    // 2. REAL-TIME WORD-BY-WORD KHMER TIMELINE (EXACT AUDIO CADENCE)
    // ==============================================================
    const PHRASES = [
      // 1. អាចទេ... បើខ្ញុំឈប់យំ
      { id: 1, start: 0.1, end: 3.6, words: [
        { t: 0.1, w: "អាចទេ" },
        { t: 1.2, w: "បើ" },
        { t: 1.5, w: "ខ្ញុំ" },
        { t: 2.0, w: "ឈប់" },
        { t: 2.5, w: "យំ" }
      ]},
      // 2. បើមេឃឈប់ភ្លៀង តើខ្ញុំឈប់យំមែនទេ?
      { id: 2, start: 3.8, end: 7.5, words: [
        { t: 3.8, w: "បើ" },
        { t: 4.1, w: "មេឃ" },
        { t: 4.5, w: "ឈប់" },
        { t: 4.8, w: "ភ្លៀង" },
        { t: 5.4, w: "តើ" },
        { t: 5.7, w: "ខ្ញុំ" },
        { t: 6.1, w: "ឈប់" },
        { t: 6.4, w: "យំ" },
        { t: 6.8, w: "មែនទេ?" }
      ]},
      // 3. ឈប់ស្នេហ៍មាសមេ
      { id: 3, start: 7.8, end: 10.0, words: [
        { t: 7.8, w: "ឈប់" },
        { t: 8.2, w: "ស្នេហ៍" },
        { t: 8.6, w: "មាស" },
        { t: 9.0, w: "មេ" }
      ]},
      // 4. ឈប់ខ្វល់ និងឈប់ពាក់ព័ន្ធជិតឆ្ងាយ
      { id: 4, start: 10.2, end: 12.8, words: [
        { t: 10.2, w: "ឈប់" },
        { t: 10.6, w: "ខ្វល់" },
        { t: 11.1, w: "និង" },
        { t: 11.4, w: "ឈប់" },
        { t: 11.7, w: "ពាក់ព័ន្ធ" },
        { t: 12.1, w: "ជិត" },
        { t: 12.5, w: "ឆ្ងាយ" }
      ]},
      // 5. ដើរចេញក៏មិនបាច់ប្រាប់ហេតុផល
      { id: 5, start: 13.0, end: 15.4, words: [
        { t: 13.0, w: "ដើរចេញ" },
        { t: 13.5, w: "ក៏" },
        { t: 13.8, w: "មិនបាច់" },
        { t: 14.3, w: "ប្រាប់" },
        { t: 14.8, w: "ហេតុផល" }
      ]},
      // 6. ហើយអូនក៏មិនបាច់ត្រូវស្តាប់ហេតុផល
      { id: 6, start: 15.6, end: 18.0, words: [
        { t: 15.6, w: "ហើយ" },
        { t: 15.9, w: "អូន" },
        { t: 16.2, w: "ក៏" },
        { t: 16.5, w: "មិនបាច់" },
        { t: 17.0, w: "ត្រូវ" },
        { t: 17.3, w: "ស្តាប់" },
        { t: 17.7, w: "ហេតុផល" }
      ]},
      // 7. បងស្រក់ទឹកភ្នែក...
      { id: 7, start: 18.2, end: 20.6, words: [
        { t: 18.2, w: "បង" },
        { t: 18.6, w: "ស្រក់" },
        { t: 19.1, w: "ទឹកភ្នែក..." }
      ]},
      // 8. បើមេឃឈប់ភ្លៀង តើខ្ញុំឈប់យំមែនទេ?
      { id: 8, start: 20.8, end: 24.6, words: [
        { t: 20.8, w: "បើ" },
        { t: 21.1, w: "មេឃ" },
        { t: 21.5, w: "ឈប់" },
        { t: 21.8, w: "ភ្លៀង" },
        { t: 22.4, w: "តើ" },
        { t: 22.7, w: "ខ្ញុំ" },
        { t: 23.1, w: "ឈប់" },
        { t: 23.4, w: "យំ" },
        { t: 23.8, w: "មែនទេ?" }
      ]},
      // 9. ស្មោះស្ម័គ្រស្នេហ៍គេ
      { id: 9, start: 24.8, end: 26.6, words: [
        { t: 24.8, w: "ស្មោះ" },
        { t: 25.2, w: "ស្ម័គ្រ" },
        { t: 25.6, w: "ស្នេហ៍" },
        { t: 26.1, w: "គេ" }
      ]},
      // 10. ស្រមៃមើលគេទាក់ទងម្តង ២-៣
      { id: 10, start: 26.8, end: 30.4, words: [
        { t: 26.8, w: "ស្រមៃ" },
        { t: 27.3, w: "មើល" },
        { t: 27.7, w: "គេ" },
        { t: 28.2, w: "ទាក់ទង" },
        { t: 28.8, w: "ម្តង" },
        { t: 29.3, w: "២-៣" }
      ]},
      // 11. សម្លាប់ក្តីសង្ឃឹមជាសន្សឹមៗ
      { id: 11, start: 30.6, end: 33.0, words: [
        { t: 30.6, w: "សម្លាប់" },
        { t: 31.1, w: "ក្តី" },
        { t: 31.5, w: "សង្ឃឹម" },
        { t: 32.1, w: "ជា" },
        { t: 32.6, w: "សន្សឹមៗ" }
      ]},
      // 12. ចង់ស្រឡាញ់អ្នកថ្មី
      { id: 12, start: 33.2, end: 35.6, words: [
        { t: 33.2, w: "ចង់" },
        { t: 33.7, w: "ស្រឡាញ់" },
        { t: 34.2, w: "អ្នក" },
        { t: 34.7, w: "ថ្មី" }
      ]},
      // 13. បើឈប់ភ្លៀង បងចង់ឈប់ស្នេហ៍ស្រី...
      { id: 13, start: 35.8, end: 39.4, words: [
        { t: 35.8, w: "បើ" },
        { t: 36.2, w: "ឈប់" },
        { t: 36.6, w: "ភ្លៀង" },
        { t: 37.1, w: "បង" },
        { t: 37.5, w: "ចង់" },
        { t: 37.9, w: "ឈប់" },
        { t: 38.3, w: "ស្នេហ៍" },
        { t: 38.7, w: "ស្រី..." }
      ]}
    ];

    let hasStarted = false;
    let currentPhraseId = null;
    let renderedWords = new Set();
    let syncTimer = null;

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      setInterval(spawnAmberEmber, 320);

      // Real-time Audio-Synced Clock (Runs every 25ms for zero-latency word pop)
      const clockStart = performance.now();

      syncTimer = setInterval(() => {
        let curTime = 0;
        if (!player.paused && player.currentTime > 0) {
          curTime = player.currentTime;
        } else {
          curTime = (performance.now() - clockStart) / 1000;
        }

        handleWordByWordSync(curTime);

        // Loop after 39.5 seconds
        if (curTime >= 39.5) {
          currentPhraseId = null;
          renderedWords.clear();
          player.currentTime = 0;
          player.play().catch(() => {});
        }
      }, 25);
    }

    function handleWordByWordSync(currentTime) {
      const box = document.getElementById('lyric-box');
      
      // Find which phrase is active right now
      const activePhrase = PHRASES.find(p => currentTime >= p.start && currentTime <= p.end);

      if (activePhrase) {
        // If this is a new phrase, clear previous words
        if (currentPhraseId !== activePhrase.id) {
          currentPhraseId = activePhrase.id;
          box.innerHTML = '';
        }

        // Check each word in this phrase
        activePhrase.words.forEach((wordObj, idx) => {
          const wordKey = `${activePhrase.id}_${idx}`;
          if (currentTime >= wordObj.t && !renderedWords.has(wordKey)) {
            renderedWords.add(wordKey);

            const span = document.createElement('span');
            span.className = 'word-token';
            span.textContent = wordObj.w;
            box.appendChild(span);
          }
        });
      } else {
        // Clear box during pauses between phrases
        if (currentPhraseId !== null) {
          currentPhraseId = null;
          box.innerHTML = '';
        }
      }
    }

    // Direct iPad Touch Event Listener
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startCinema);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startCinema();
    });

    function spawnAmberEmber() {
      const ember = document.createElement('div');
      ember.className = 'amber-ember';
      const size = Math.random() * 3.5 + 2;
      ember.style.width = `${size}px`;
      ember.style.height = `${size}px`;
      ember.style.left = `${Math.random() * window.innerWidth}px`;
      ember.style.top = `${window.innerHeight * 0.72 + Math.random() * 100}px`;
      document.body.appendChild(ember);
      setTimeout(() => ember.remove(), 6000);
    }
  </script>
</body>
</html>
