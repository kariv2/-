<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <!-- Google Fonts for High-Quality Khmer Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,500;0,600;0,700;1,400&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #04060a;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================
       1. CANVAS: OUTSIDE RAIN, HEADLIGHT BOKEH & GLASS DROPLETS
       ========================================================== */
    #window-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at 45% 40%, #0e1526 0%, #04060a 100%);
    }

    /* ==========================================================
       2. SVG: ROOM INTERIOR & MAN SITTING AT THE WINDOW
       ========================================================== */
    #scene-svg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    /* Rising steam from mug */
    .steam-line {
      stroke: rgba(255, 230, 180, 0.45);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      animation: steamFlow 2.8s ease-in-out infinite;
    }
    @keyframes steamFlow {
      0% { opacity: 0; transform: translateY(0) scaleX(0.8); }
      50% { opacity: 0.65; transform: translateY(-12px) scaleX(1.2); }
      100% { opacity: 0; transform: translateY(-24px) scaleX(1.4); }
    }

    /* 3. 35MM VINTAGE FILM GRAIN & LETTERBOX */
    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
      z-index: 25;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: grainFlicker 0.15s infinite;
    }
    @keyframes grainFlicker {
      0% { transform: translate(0, 0); opacity: 0.14; }
      50% { transform: translate(1px, -1px); opacity: 0.2; }
      100% { transform: translate(-1px, 1px); opacity: 0.15; }
    }

    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 5.5vh;
      background: #000;
      z-index: 100;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    /* ==========================================================
       4. GLOWING GOLDEN KHMER WORD-BY-WORD LYRICS
       ========================================================== */
    #lyric-container {
      position: fixed;
      left: 0; right: 0;
      bottom: 11vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 80;
      pointer-events: none;
      padding: 0 24px;
    }

    .lyric-box {
      text-align: center;
      max-width: min(92vw, 850px);
      min-height: 90px;
    }

    .lyric-text {
      font-family: 'Koulen', 'Kantumruy Pro', cursive, sans-serif;
      font-size: clamp(24px, 3.8vw, 44px);
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 0.03em;

      /* Radiant Amber-Gold Metallic Gradient */
      background: linear-gradient(180deg, #fffbe6 0%, #ffd166 45%, #f78c6c 80%, #d46517 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      /* Intense Warm Golden Glow */
      filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.9))
              drop-shadow(0 0 35px rgba(247, 140, 108, 0.55))
              drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95));
    }

    /* Word-by-Word Pop Animation */
    .word-token {
      display: inline-block;
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      animation: wordPopGlow 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
      margin: 0 4px;
    }
    @keyframes wordPopGlow {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lyric-sub {
      display: block;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: clamp(13px, 1.8vw, 18px);
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-top: 8px;
      color: rgba(255, 240, 180, 0.85);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
      opacity: 0;
      animation: subFadeIn 0.5s ease forwards 0.2s;
    }
    @keyframes subFadeIn { to { opacity: 1; } }

    /* Floating Golden Amber Embers */
    .amber-ember {
      position: fixed;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166, 0 0 16px #f78c6c;
      pointer-events: none;
      z-index: 30;
      animation: floatEmber 6.5s ease-out forwards;
    }
    @keyframes floatEmber {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-380px) scale(1.3); }
    }

    /* Start Screen */
    #start-screen {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 7, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 200;
    }

    #start-btn {
      padding: 18px 48px;
      font-family: 'Koulen', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffd166, #f78c6c);
      color: #1a0f05;
      border: 1px solid rgba(255, 249, 214, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.5);
      transition: transform 0.2s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 14px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Hidden Media Player (Loops non-stop) -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <!-- Widescreen Cinematic Letterbox -->
  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>

  <!-- Rain Canvas (Outside rain, wet bokeh, droplets trickling on window pane) -->
  <canvas id="window-canvas"></canvas>

  <!-- ============================================================== -->
  <!-- SVG: MAN SITTING IN THE WINDOW IN THE RAIN MISSING HIS LOVE    -->
  <!-- ============================================================== -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Warm Interior Room Lamp Glow -->
      <radialGradient id="roomWarmGlow" cx="88%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.32" />
        <stop offset="60%" stop-color="#ff9800" stop-opacity="0.08" />
        <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
      </radialGradient>
      <!-- Cold Outside Rainy Window Glow -->
      <linearGradient id="windowSillLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3a4b68" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#141c2c" stop-opacity="0.9" />
      </linearGradient>
    </defs>

    <!-- Warm Lamp Glow on the Room Wall -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#roomWarmGlow)" />

    <!-- ROOM INTERIOR FRAME (Dark Silhouette framing the window) -->
    <!-- Left Wall & Ceiling -->
    <path d="M 0,0 L 1920,0 L 1920,120 L 1600,120 L 1600,820 L 320,820 L 320,120 L 0,120 Z" fill="#04060a" />
    <path d="M 0,0 L 320,0 L 320,1080 L 0,1080 Z" fill="#04060a" />
    <path d="M 1600,0 L 1920,0 L 1920,1080 L 1600,1080 Z" fill="#04060a" />
    <!-- Lower Room Floor / Wall under window -->
    <path d="M 0,820 L 1920,820 L 1920,1080 L 0,1080 Z" fill="#04060a" />

    <!-- WINDOW SILL (Wooden ledge where he sits) -->
    <rect x="280" y="800" width="1360" height="32" rx="4" fill="url(#windowSillLight)" stroke="#0e1522" stroke-width="2" />

    <!-- WINDOW MULLIONS / GLASS DIVIDERS (Classic wooden window crossbars) -->
    <line x1="960" y1="120" x2="960" y2="800" stroke="#080c14" stroke-width="12" />
    <line x1="320" y1="460" x2="1600" y2="460" stroke="#080c14" stroke-width="10" />

    <!-- Curtains draped gently on the sides -->
    <path d="M 320,120 Q 420,400 360,780 L 320,780 Z" fill="#080b12" opacity="0.85" />
    <path d="M 1600,120 Q 1500,400 1560,780 L 1600,780 Z" fill="#080b12" opacity="0.85" />

    <!-- STEAMING COFFEE MUG ON THE WINDOW SILL -->
    <g transform="translate(680, 770)">
      <rect x="0" y="10" width="22" height="20" rx="3" fill="#182234" stroke="#4a6288" stroke-width="1.2" />
      <path d="M 22,14 C 28,14 28,24 22,24" stroke="#4a6288" stroke-width="1.2" fill="none" />
      <!-- Animated rising steam -->
      <path class="steam-line" d="M 8,8 Q 12,2 8,-6 Q 4,-12 10,-18" />
      <path class="steam-line" style="animation-delay: 1.2s;" d="M 14,8 Q 10,2 14,-6 Q 18,-12 12,-18" />
    </g>

    <!-- ============================================================== -->
    <!-- SILHOUETTE: MAN SITTING IN THE WINDOW GAZING INTO THE RAIN     -->
    <!-- ============================================================== -->
    <g transform="translate(940, 480)">
      <!-- Back warm rim light accent -->
      <path d="M 120,320 
               C 105,270 95,220 90,180 
               C 85,150 90,120 100,90 
               C 105,75 110,60 105,45 
               C 100,30 90,20 75,15 
               C 55,8 40,18 35,35 
               C 30,50 35,65 30,80 
               C 22,100 10,130 0,165 
               C -15,220 -20,270 -20,320 Z" 
            fill="#06090f" 
            stroke="#ffb74d" 
            stroke-width="1"

      <!-- Body / Overcoat silhouette sitting on the sill -->
      <!-- Legs pulled up / resting on the ledge -->
      <path d="M -80,320 
               C -70,240 -40,210 10,210 
               C 60,210 110,240 130,320 Z" 
            fill="#04060a" />

      <!-- Torso leaning forward slightly toward the glass -->
      <path d="M -15,320 
               C -25,250 -10,170 15,130 
               C 30,105 55,95 80,105 
               C 100,115 115,160 110,230 
               C 105,280 120,320 120,320 Z" 
            fill="#030408" />

      <!-- Arm resting on window sill / Hand supporting his chin -->
      <path d="M 35,170 
               C 10,195 -30,225 -45,260 
               C -55,285 -50,315 -48,320 
               L -28,320 
               C -30,300 -35,275 -18,250 
               C -5,230 20,205 45,185 Z" 
            fill="#05070c" />

      <!-- Forearm raised up to cheek -->
      <path d="M -45,260 
               C -40,230 -25,185 10,135 
               L 25,145 
               C -5,190 -20,235 -25,265 Z" 
            fill="#04060a" />

      <!-- Head tilted, gazing out into the dark rain (lost in memories) -->
      <path d="M 15,130 
               C 5,120 0,105 2,90 
               C 5,70 18,55 35,50 
               C 50,45 70,50 80,65 
               C 90,80 88,105 75,125 
               C 60,140 35,145 15,130 Z" 
            fill="#030508" />

      <!-- Messy hair outline silhouetted against the rainy outside -->
      <path d="M 2,90 
               C -8,80 -10,65 -5,55 
               C 0,45 12,40 18,35 
               C 25,25 40,20 55,22 
               C 70,25 85,35 92,50 
               C 98,62 95,78 88,90 
               C 80,72 65,60 50,58 
               C 35,56 18,68 12,85 Z" 
            fill="#020306" />
    </g>
  </svg>

  <!-- 35mm Vintage Film Grain -->
  <div id="film-grain"></div>

  <!-- ============================================================== -->
  <!-- 4. CENTER WORD-BY-WORD GOLDEN KHMER LYRICS STAGE               -->
  <!-- ============================================================== -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box">
      <!-- Words injected dynamically on beat -->
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <button id="start-btn" onclick="startCinema()">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
    <p class="subtitle">បើកសំឡេងឡើងដើម្បីស្តាប់បទ "បើមេឃឈប់ភ្លៀង"</p>
  </div>

  <script>
    // ==============================================================
    // 1. CANVAS: OUTSIDE RAIN, HEADLIGHT BOKEH & GLASS DROPLETS
    // ==============================================================
    const canvas = document.getElementById('window-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let outsideRain = [];
    let bokehs = [];
    let glassDroplets = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    function initScene() {
      // 1. Outside fast rain streaks
      outsideRain = [];
      const rainCount = Math.floor(width * 0.35);
      for (let i = 0; i < rainCount; i++) {
        outsideRain.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 24 + 14,
          speed: Math.random() * 12 + 14,
          opacity: Math.random() * 0.35 + 0.15
        });
      }

      // 2. City streetlight & car bokeh in the distance
      bokehs = [];
      const bokehColors = [
        'rgba(255, 209, 102, ', // Warm Streetlamp Amber
        'rgba(255, 82, 82, ',   // Red Taillight
        'rgba(144, 205, 244, ', // Rainy Cold Blue
        'rgba(255, 240, 180, '  // Warm Glow
      ];
      for (let i = 0; i < 20; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.25 + Math.random() * (height * 0.55),
          radius: Math.random() * 50 + 20,
          color: bokehColors[Math.floor(Math.random() * bokehColors.length)],
          alpha: Math.random() * 0.22 + 0.08,
          drift: (Math.random() - 0.5) * 0.35,
          pulse: Math.random() * Math.PI
        });
      }

      // 3. Trickling Raindrops on the Window Glass
      glassDroplets = [];
      for (let i = 0; i < 45; i++) {
        glassDroplets.push({
          x: width * 0.18 + Math.random() * (width * 0.64),
          y: Math.random() * (height * 0.75) + (height * 0.1),
          r: Math.random() * 2.8 + 1.2,
          speed: Math.random() * 0.8 + 0.15,
          trail: []
        });
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, width, height);

      // Draw Distant Bokeh Lights
      bokehs.forEach(b => {
        b.x += b.drift;
        b.pulse += 0.02;
        const currentAlpha = b.alpha + Math.sin(b.pulse) * 0.05;
        
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
        grad.addColorStop(0, b.color + currentAlpha + ')');
        grad.addColorStop(1, b.color + '0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        if (b.x < -b.radius) b.x = width + b.radius;
        if (b.x > width + b.radius) b.x = -b.radius;
      });

      // Draw Outside Rain Streaks
      ctx.lineWidth = 1.2;
      outsideRain.forEach(r => {
        ctx.strokeStyle = `rgba(160, 205, 255, ${r.opacity})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.length);
        ctx.stroke();

        r.y += r.speed;
        r.x += 1;
        if (r.y > height) {
          r.y = -r.length;
          r.x = Math.random() * width;
        }
      });

      // Draw Trickling Raindrops on Window Glass
      glassDroplets.forEach(d => {
        // Draw droplet head with light reflection
        ctx.fillStyle = 'rgba(210, 235, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();

        // Droplet slowly slides down
        d.y += d.speed;

        // Occasional sudden droplet run
        if (Math.random() < 0.015) {
          d.speed = Math.random() * 2.5 + 1.2;
        } else if (Math.random() < 0.04) {
          d.speed = Math.random() * 0.4 + 0.1;
        }

        // Reset droplet at top of window
        if (d.y > height * 0.78) {
          d.y = height * 0.12;
          d.x = width * 0.18 + Math.random() * (width * 0.64);
          d.speed = Math.random() * 0.8 + 0.15;
        }
      });

      requestAnimationFrame(renderCanvas);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderCanvas();

    // ==============================================================
    // 2. TIMED KHMER LYRICS (WORD-BY-WORD ENGINE)
    // ==============================================================
    const TIMED_LYRICS = [
      { time: 0.2,  text: "តើអាចទេ បើ ខ្ញុំ ឈប់យំ", duration: 3.2, sub: "can i stop crying?" },
      { time: 3.8,  text: "បើ មេឃ ឈប់ភ្លៀង តើខ្ញុំ ឈប់យំ មែនទេ?", duration: 3.4, sub: "if rain stops, will tears dry?" },
      { time: 7.6,  text: "ឈប់ស្នេហ៍ មាសមេ ឈប់ខ្វល់", duration: 2.6, sub: "stop loving you..." },
      { time: 10.4, text: "ឈប់ ពាក់ព័ន្ធ ជិតឆ្ងាយ...", duration: 2.4, sub: "letting you go forever" },
      { time: 13.0, text: "ដើរចេញ ក៏ មិនបាច់ ប្រាប់ហេតុផល", duration: 3.2, sub: "walk away without goodbye" },
      { time: 16.6, text: "បង ស្រក់ ទឹកភ្នែក...", duration: 3.4, sub: "tears falling in the rain" },
      { time: 20.8, text: "បើ មេឃ ឈប់ភ្លៀង តើខ្ញុំ ឈប់យំ មែនទេ?", duration: 3.6, sub: "if rain stops, will i heal?" },
      { time: 24.8, text: "ស្មោះស្ម័គ្រ ស្នេហ៍គេ ស្រមៃ គេមាន ២ ៣", duration: 4.8, sub: "loving you while you love another" },
      { time: 30.2, text: "សម្លាប់ ក្តីសង្ឃឹម ជាសន្សឹមៗ ចង់ស្រលាញ់ អ្នកថ្មី", duration: 4.8, sub: "slowly killing all my hope" },
      { time: 35.4, text: "បើ ឈប់ភ្លៀង បងចង់ ឈប់ស្នេហ៍ ស្រី...", duration: 4.4, sub: "when the rain ends, i will stop loving you" }
    ];

    let hasStarted = false;
    let loopTimeout = null;

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      document.getElementById('start-screen').style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play gesture:", e));

      // Continuous floating amber embers
      setInterval(spawnAmberEmber, 320);

      // Play synced word-by-word lyrics
      playWordTimeline();
    }

    function playWordTimeline() {
      const box = document.getElementById('lyric-box');

      TIMED_LYRICS.forEach(item => {
        setTimeout(() => {
          renderWordByWord(item.text, item.duration, item.sub);
        }, item.time * 1000);
      });

      // Seamless non-stop loop every 40.5s
      loopTimeout = setTimeout(() => {
        restartTimeline();
      }, 40500);
    }

    // Renders words sequentially in sync with singing
    function renderWordByWord(fullText, vocalDuration, subText) {
      const box = document.getElementById('lyric-box');
      box.innerHTML = '';

      const lineContainer = document.createElement('div');
      lineContainer.className = 'lyric-text';
      box.appendChild(lineContainer);

      const words
