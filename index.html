<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>បើមេឃឈប់ភ្លៀង</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Koulen&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #04060a;
      font-family: 'Koulen', 'Kantumruy Pro', sans-serif;
    }

    /* 1. REALISTIC PHOTO BACKGROUND */
    #bg-photo {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
      /* Moody cold-slate saturation */
      filter: saturate(92%) contrast(106%) brightness(88%);
    }

    /* 2. COLD RAINY DAY MOODY TINT */
    #rainy-tint {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 35% 45%, rgba(15, 25, 45, 0.2) 0%, rgba(5, 7, 12, 0.65) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* 3. CANVAS OVERLAY (Falling Rain & Droplets Trickling Down Glass) */
    #rain-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    /* 4. CINEMATIC LETTERBOX & FILM GRAIN */
    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 4.5vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.12;
      pointer-events: none;
      z-index: 15;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.10; }
      50% { opacity: 0.15; }
      100% { opacity: 0.11; }
    }

    /* ==========================================================
       5. BOTTOM PURE KHMER LYRICS (SAD & SUBDUED)
       ========================================================== */
    #lyric-container {
      position: fixed;
      left: 0; right: 0;
      bottom: 6.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      padding: 0 20px;
    }

    .lyric-box {
      text-align: center;
      min-height: 65px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .word-token {
      display: inline-block;
      color: #cfc8b8 !important; /* Muted vintage ash-cream */
      font-family: 'Koulen', 'Kantumruy Pro', cursive, sans-serif;
      font-size: clamp(23px, 3.4vw, 38px);
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 0 5px;
      opacity: 0.92;
      text-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.95),
        0 0 14px rgba(185, 175, 155, 0.28);
      animation: wordSadFade 0.3s ease-out both;
    }

    @keyframes wordSadFade {
      0% {
        opacity: 0;
        transform: translateY(6px);
        filter: blur(2px);
      }
      100% {
        opacity: 0.92;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    /* ==========================================================
       6. START SCREEN (IPAD COMPLIANT)
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(3, 4, 7, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff9d6;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
      max-width: 330px;
    }

    #start-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: 'Koulen', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffd166, #f78c6c);
      color: #1a0f05;
      border: 1px solid rgba(255, 249, 214, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.95); }

    /* Custom photo selector */
    .photo-upload-container {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13.5px;
      color: #dfc299;
      background: rgba(30, 24, 18, 0.6);
      border: 1px dashed rgba(255, 209, 102, 0.5);
      border-radius: 25px;
      text-align: center;
      overflow: hidden;
    }
    .photo-upload-container input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 14px;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Media Player with your uploaded song file -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <!-- 1. REALISTIC PHOTO AS THE BASE BACKGROUND -->
  <img id="bg-photo" src="photo.jpg" alt="Sitting at Window">

  <!-- 2. COLD RAINY DAY TINT -->
  <div id="rainy-tint"></div>

  <!-- 3. CANVAS OVERLAY (Falling Rain & Water Droplets on Glass) -->
  <canvas id="rain-canvas"></canvas>

  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>
  <div id="film-grain"></div>

  <!-- 4. BOTTOM KHMER WORD-BY-WORD LYRICS -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="btn-group">
      <button id="start-btn">▶ ចាក់ចម្រៀង & គំនូរជីវចល</button>
      
      <!-- Pick this photo from iPad Photos if you haven't uploaded photo.jpg to GitHub -->
      <div class="photo-upload-container">
        <span id="photo-label">📷 ជ្រើសរើសរូបថតនេះពី iPad (Pick Photo)</span>
        <input type="file" id="photo-input" accept="image/*" onchange="handlePhotoUpload(this)">
      </div>
    </div>
    <p class="subtitle" id="status-text">(បើកសំឡេងឡើងដើម្បីស្តាប់បទ "បើមេឃឈប់ភ្លៀង")</p>
  </div>

  <script>
    // ==============================================================
    // 1. CANVAS: FALLING RAIN & WATER DROPLETS TRICKLING ON GLASS
    // ==============================================================
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let rain = [];
    let glassDrops = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initRain();
    }

    function initRain() {
      rain = [];
      const count = Math.floor(width * 0.32);
      for (let i = 0; i < count; i++) {
        rain.push({
          x: Math.random() * width,
          y: Math.random() * height,
          l: Math.random() * 24 + 14,
          s: Math.random() * 12 + 14,
          a: Math.random() * 0.35 + 0.15
        });
      }

      glassDrops = [];
      for (let i = 0; i < 40; i++) {
        glassDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.6 + 1.2,
          s: Math.random() * 0.6 + 0.12
        });
      }
    }

    function drawRain() {
      ctx.clearRect(0, 0, width, height);

      // Fast slanted rain streaks
      ctx.lineWidth = 1.1;
      rain.forEach(r => {
        ctx.strokeStyle = `rgba(180, 215, 255, ${r.a})`;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 2, r.y + r.l);
        ctx.stroke();

        r.y += r.s;
        r.x += 0.8;
        if (r.y > height) {
          r.y = -r.l;
          r.x = Math.random() * width;
        }
      });

      // Water droplets sliding on window glass
      glassDrops.forEach(d => {
        ctx.fillStyle = 'rgba(215, 235, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();

        d.y += d.s;

        // Occasional sudden run
        if (Math.random() < 0.015) {
          d.s = Math.random() * 2.2 + 1.0;
        } else if (Math.random() < 0.04) {
          d.s = Math.random() * 0.4 + 0.1;
        }

        if (d.y > height) {
          d.y = 0;
          d.x = Math.random() * width;
        }
      });

      requestAnimationFrame(drawRain);
    }

    window.addEventListener('resize', resize);
    resize();
    drawRain();

    // ==============================================================
    // 2. TIMED KHMER LYRICS (WORD-BY-WORD ONLY IN KHMER)
    // ==============================================================
    const PHRASES = [
      { id: 1, start: 0.1, end: 3.6, words: [
        { t: 0.1, w: "អាចទេ" }, { t: 1.2, w: "បើ" }, { t: 1.5, w: "ខ្ញុំ" }, { t: 2.0, w: "ឈប់" }, { t: 2.5, w: "យំ" }
      ]},
      { id: 2, start: 3.8, end: 7.5, words: [
        { t: 3.8, w: "បើ" }, { t: 4.1, w: "មេឃ" }, { t: 4.5, w: "ឈប់" }, { t: 4.8, w: "ភ្លៀង" },
        { t: 5.4, w: "តើ" }, { t: 5.7, w: "ខ្ញុំ" }, { t: 6.1, w: "ឈប់" }, { t: 6.4, w: "យំ" }, { t: 6.8, w: "មែនទេ?" }
      ]},
      { id: 3, start: 7.8, end: 10.0, words: [
        { t: 7.8, w: "ឈប់" }, { t: 8.2, w: "ស្នេហ៍" }, { t: 8.6, w: "មាស" }, { t: 9.0, w: "មេ" }
      ]},
      { id: 4, start: 10.2, end: 12.8, words: [
        { t: 10.2, w: "ឈប់" }, { t: 10.6, w: "ខ្វល់" }, { t: 11.1, w: "និង" }, { t: 11.4, w: "ឈប់" },
        { t: 11.7, w: "ពាក់ព័ន្ធ" }, { t: 12.1, w: "ជិត" }, { t: 12.5, w: "ឆ្ងាយ" }
      ]},
      { id: 5, start: 13.0, end: 15.4, words: [
        { t: 13.0, w: "ដើរចេញ" }, { t: 13.5, w: "ក៏" }, { t: 13.8, w: "មិនបាច់" }, { t: 14.3, w: "ប្រាប់" }, { t: 14.8, w: "ហេតុផល" }
      ]},
      { id: 6, start: 15.6, end: 18.0, words: [
        { t: 15.6, w: "ហើយ" }, { t: 15.9, w: "អូន" }, { t: 16.2, w: "ក៏" }, { t: 16.5, w: "មិនបាច់" },
        { t: 17.0, w: "ត្រូវ" }, { t: 17.3, w: "ស្តាប់" }, { t: 17.7, w: "ហេតុផល" }
      ]},
      { id: 7, start: 18.2, end: 20.6, words: [
        { t: 18.2, w: "បង" }, { t: 18.6, w: "ស្រក់" }, { t: 19.1, w: "ទឹកភ្នែក..." }
      ]},
      { id: 8, start: 20.8, end: 24.6, words: [
        { t: 20.8, w: "បើ" }, { t: 21.1, w: "មេឃ" }, { t: 21.5, w: "ឈប់" }, { t: 21.8, w: "ភ្លៀង" },
        { t: 22.4, w: "តើ" }, { t: 22.7, w: "ខ្ញុំ" }, { t: 23.1, w: "ឈប់" }, { t: 23.4, w: "យំ" }, { t: 23.8, w: "មែនទេ?" }
      ]},
      { id: 9, start: 24.8, end: 26.6, words: [
        { t: 24.8, w: "ស្មោះ" }, { t: 25.2, w: "ស្ម័គ្រ" }, { t: 25.6, w: "ស្នេហ៍" }, { t: 26.1, w: "គេ" }
      ]},
      { id: 10, start: 26.8, end: 30.4, words: [
        { t: 26.8, w: "ស្រមៃ" }, { t: 27.3, w: "មើល" }, { t: 27.7, w: "គេ" }, { t: 28.2, w: "ទាក់ទង" }, { t: 28.8, w: "ម្តង" }, { t: 29.3, w: "២-៣" }
      ]},
      { id: 11, start: 30.6, end: 33.0, words: [
        { t: 30.6, w: "សម្លាប់" }, { t: 31.1, w: "ក្តី" }, { t: 31.5, w: "សង្ឃឹម" }, { t: 32.1, w: "ជា" }, { t: 32.6, w: "សន្សឹមៗ" }
      ]},
      { id: 12, start: 33.2, end: 35.6, words: [
        { t: 33.2, w: "ចង់" }, { t: 33.7, w: "ស្រឡាញ់" }, { t: 34.2, w: "អ្នក" }, { t: 34.7, w: "ថ្មី" }
      ]},
      { id: 13, start: 35.8, end: 39.4, words: [
        { t: 35.8, w: "បើ" }, { t: 36.2, w: "ឈប់" }, { t: 36.6, w: "ភ្លៀង" }, { t: 37.1, w: "បង" },
        { t: 37.5, w: "ចង់" }, { t: 37.9, w: "ឈប់" }, { t: 38.3, w: "ស្នេហ៍" }, { t: 38.7, w: "ស្រី..." }
      ]}
    ];

    let hasStarted = false;
    let currentPhraseId = null;
    let renderedWords = new Set();
    let syncTimer = null;

    // Handles picking photo directly from iPad
    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        document.getElementById('bg-photo').src = URL.createObjectURL(file);
        document.getElementById('photo-label').innerText = "✓ បានជ្រើសរើសរូបថត!";
      }
    }

    function startCinema() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      const clockStart = performance.now();

      syncTimer = setInterval(() => {
        let curTime = 0;
        if (!player.paused && player.currentTime > 0) {
          curTime = player.currentTime;
        } else {
          curTime = (performance.now() - clockStart) / 1000;
        }

        handleWordByWordSync(curTime);

        if (curTime >= 39.5) {
          currentPhraseId = null;
          renderedWords.clear();
          player.currentTime = 0;
          player.play().catch(() => {});
        }
      }, 25);
    }

    function handleWordByWordSync(currentTime) {
      const box = document.getElementById('lyric-box');
      const activePhrase = PHRASES.find(p => currentTime >= p.start && currentTime <= p.end);

      if (activePhrase) {
        if (currentPhraseId !== activePhrase.id) {
          currentPhraseId = activePhrase.id;
          box.innerHTML = '';
        }

        activePhrase.words.forEach((wordObj, idx) => {
          const wordKey = `${activePhrase.id}_${idx}`;
          if (currentTime >= wordObj.t && !renderedWords.has(wordKey)) {
            renderedWords.add(wordKey);

            const span = document.createElement('span');
            span.className = 'word-token';
            span.textContent = wordObj.w;
            box.appendChild(span);
          }
        });
      } else {
        if (currentPhraseId !== null) {
          currentPhraseId = null;
          box.innerHTML = '';
        }
      }
    }

    // Direct iPad Touch Event Listener
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startCinema);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startCinema();
    });
  </script>
</body>
</html>
